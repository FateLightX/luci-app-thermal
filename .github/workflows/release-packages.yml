name: release-packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: verify translation catalogues
        run: ./tests/check-i18n.sh

      - id: version
        name: resolve release version
        run: |
          set -eu
          version=$(sh ./luci-app-thermal/scripts/version.sh) || {
            echo "::error::could not derive the version from the commit"; exit 1; }
          release_version="v${version}"
          printf '%s\n' "$release_version" | grep -Eq '^v[0-9]{4}[.][0-9]{2}[.][0-9]{2}$' || {
            echo "::error::malformed version: $release_version"; exit 1; }
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

  release:
    needs: validate
    name: x86_64-SNAPSHOT release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # luci.mk derives PKG_PO_VERSION from git log; a shallow clone makes
          # that fall back to file mtimes and produces unstable versions.
          fetch-depth: 0

      - name: build
        uses: openwrt/gh-action-sdk@797d0e3d0eb13b355c3447f60d0179d4b43089e2 # main
        env:
          ARCH: x86_64-SNAPSHOT
          FEEDNAME: thermal
          PACKAGES: luci-app-thermal
          # INDEX/signing only take effect when the secrets exist; without them
          # the run still produces unsigned .apk files that install with
          # --allow-untrusted.
          INDEX: 1
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NO_REFRESH_CHECK: true

      - name: verify artifacts
        run: |
          set -eu
          out="bin/packages/x86_64/thermal"
          ls -la "$out"
          test -n "$(find "$out" -name 'luci-app-thermal-*.apk' -print -quit)" \
            || { echo "::error::main package missing"; exit 1; }
          test -n "$(find "$out" -name 'luci-i18n-thermal-zh-cn-*.apk' -print -quit)" \
            || { echo "::error::zh-cn translation package missing"; exit 1; }

      - name: compress
        run: |
          set -eu
          tar -c -z -f luci-app-thermal_x86_64-SNAPSHOT.tar.gz \
            -C bin/packages/x86_64/thermal .
          sha256sum luci-app-thermal_x86_64-SNAPSHOT.tar.gz > SHA256SUMS

      - name: release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.validate.outputs.release_version }}
          name: ${{ needs.validate.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          files: |
            luci-app-thermal_x86_64-SNAPSHOT.tar.gz
            SHA256SUMS

      - name: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: luci-app-thermal_x86_64-SNAPSHOT
          path: bin/packages/x86_64/thermal
