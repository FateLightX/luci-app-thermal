name: build-packages

on:
  workflow_dispatch:
  push:
    paths:
      - 'luci-app-thermal/**'
      - '.github/workflows/build-packages.yml'
  pull_request:
    paths:
      - 'luci-app-thermal/**'
      - '.github/workflows/build-packages.yml'

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Catches the failure mode that bit this package before: strings added to
      # the UI but never added to the catalogues, which ship as silent English.
      - name: verify translation catalogues
        run: ./tests/check-i18n.sh

  build:
    needs: check
    name: ${{ matrix.arch }} build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The package is architecture-independent (LUCI_PKGARCH:=all), so one
        # SDK is enough to produce the shipping .apk. x86_64 matches the
        # device this was developed against.
        arch:
          - x86_64-openwrt-25.12

    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # luci.mk derives PKG_PO_VERSION from git log; a shallow clone makes
          # that fall back to file mtimes and produces unstable versions.
          fetch-depth: 0

      - name: build
        uses: openwrt/gh-action-sdk@797d0e3d0eb13b355c3447f60d0179d4b43089e2 # main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: thermal
          PACKAGES: luci-app-thermal
          NO_REFRESH_CHECK: true
          V: s

      # The i18n subpackage is generated by luci.mk from po/<lang>/*.po, so its
      # absence means po2lmo never ran and every translation would be missing
      # at runtime. Fail loudly here rather than shipping an English-only page.
      - name: verify artifacts
        run: |
          set -eu
          out="bin/packages/x86_64/thermal"
          ls -la "$out"
          test -n "$(find "$out" -name 'luci-app-thermal-*.apk' -print -quit)" \
            || { echo "::error::main package missing"; exit 1; }
          test -n "$(find "$out" -name 'luci-i18n-thermal-zh-cn-*.apk' -print -quit)" \
            || { echo "::error::zh-cn translation package missing"; exit 1; }

      - name: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: luci-app-thermal_${{ matrix.arch }}
          path: bin/packages/x86_64/thermal
